name: Release plugin

on:
  workflow_dispatch:
    inputs:
      release-level:
        description: "Release level"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Lint skills
        run: python scripts/lint-skills.py

      - name: Verify version base matches latest tag
        run: |
          base=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$tag" != none ] && [ "v$base" != "$tag" ]; then
            echo "::error::plugin.json version $base != latest tag $tag. The release bumps FROM plugin.json, so a drifted base overshoots. Reset .claude-plugin/plugin.json to ${tag#v} (the workflow owns the bump) before releasing."
            exit 1
          fi
          echo "version base $base is clean against latest tag $tag"

      - name: Verify the Unreleased changelog section has notes
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text()
          m = re.search(r"^## Unreleased$\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = re.sub(r"<!--.*?-->", "", m.group(1), flags=re.S).strip() if m else ""
          if not body:
              print("::error::CHANGELOG.md has no '## Unreleased' section with notes. "
                    "The release body is published from that section, so write it before releasing.")
              sys.exit(1)
          print(f"unreleased section has {len(body.splitlines())} lines of notes")
          PY

      - name: Bump version in plugin.json
        env:
          RELEASE_LEVEL: ${{ github.event.inputs.release-level }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path

          level = os.environ["RELEASE_LEVEL"]
          p = Path(".claude-plugin/plugin.json")
          d = json.loads(p.read_text())
          maj, mn, pt = (int(x) for x in d["version"].split("."))
          if level == "major":
              maj, mn, pt = maj + 1, 0, 0
          elif level == "minor":
              mn, pt = mn + 1, 0
          else:
              pt += 1
          d["version"] = f"{maj}.{mn}.{pt}"
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(f"NEW_VERSION={d['version']}")
          PY

      - name: Retitle the Unreleased section and extract the release body
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          PLACEHOLDER = (
              "## Unreleased\n\n"
              "<!-- Write the notes for the next release here. The release workflow renames this"
              " heading to the new version and publishes the section as the GitHub release body."
              " An empty section fails the release. -->\n\n"
          )

          version = os.environ["NEW_VERSION"]
          p = Path("CHANGELOG.md")
          text = p.read_text()
          m = re.search(r"^## Unreleased$\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          assert m, "no '## Unreleased' section to retitle"
          # Drop the placeholder comment, retitle to the new version, and seed a fresh
          # Unreleased section above it so the next release has somewhere to write.
          body = re.sub(r"<!--.*?-->", "", m.group(1), flags=re.S).strip()
          p.write_text(f"{text[:m.start()]}{PLACEHOLDER}## {version}\n\n{body}\n\n{text[m.end():]}")
          # Same body verbatim as the release page body.
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(body + "\n")
          PY

      - name: Configure git as release bot
        env:
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config --global user.email "${GITHUB_ACTOR_ID}+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Commit, tag, verify, then push
        run: |
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "Released claude-civictheme-skills v${NEW_VERSION}."
          git tag "v${NEW_VERSION}"
          # GUARANTEE: the tag must point at a commit whose plugin.json == the tag,
          # BEFORE anything reaches GitHub. Claude consumes the manifest at the
          # tag/release, so a mismatched or un-bumped plugin.json must never ship.
          tagged=$(git show "v${NEW_VERSION}:.claude-plugin/plugin.json" | python -c "import json,sys;print(json.load(sys.stdin)['version'])")
          if [ "$tagged" != "${NEW_VERSION}" ]; then
            echo "::error::tag v${NEW_VERSION} points at plugin.json version $tagged — refusing to push a mismatched release."
            git tag -d "v${NEW_VERSION}"
            exit 1
          fi
          # Branch first (carries the bump commit), then the tag — both already verified.
          git push origin HEAD:${{ github.ref_name }}
          git push --tags

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "claude-civictheme-skills v${NEW_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --generate-notes
